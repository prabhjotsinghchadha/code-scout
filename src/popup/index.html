<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>JAV Trailer Opener</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <main>
      <form id="search">
        <input id="code-input" type="text" placeholder="Enter a code, e.g. NSFS-484" autocomplete="off" autofocus />
        <button type="submit" title="Open the video page">Open</button>
        <button type="button" id="search-btn" class="secondary" title="Search javtrailers.com">Search</button>
      </form>
      <p id="error" class="error" hidden></p>
      <div id="typed-sites" class="site-row" hidden></div>

      <section>
        <h2>On this page</h2>
        <ul id="codes"></ul>
        <p id="empty" class="muted" hidden>No codes found on this page.</p>
      </section>

      <section>
        <div class="section-head">
          <h2>Quick links</h2>
          <button type="button" id="add-page" class="link-button" title="Save the current page as a quick link">+ Add this page</button>
        </div>
        <form id="add-page-form" class="add-page" hidden>
          <select id="add-page-group" aria-label="Group"></select>
          <input id="add-page-new-group" type="text" placeholder="New group name" maxlength="30" hidden />
          <button type="submit">Save</button>
          <button type="button" id="add-page-cancel" class="secondary">Cancel</button>
        </form>
        <p id="add-page-error" class="error" hidden></p>
        <div id="links"></div>
        <p id="links-empty" class="muted" hidden>
          No quick links yet. <a href="#" id="add-links">Add sites in Settings</a>
        </p>
      </section>

      <footer>
        <div class="toggles">
          <label class="row"><input type="checkbox" id="inline" /> ▶ buttons on pages</label>
          <label class="row"><input type="checkbox" id="chip" /> Chip when typing a code</label>
          <label class="row" id="site-off-row" hidden>
            <input type="checkbox" id="site-off" /> <span>Off on <strong id="site-off-host"></strong></span>
          </label>
        </div>
        <a href="#" id="open-options">Settings</a>
      </footer>
    </main>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
