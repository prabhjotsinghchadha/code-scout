<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>JAV Trailer Opener – Settings</title>
    <style>
      :root { color-scheme: light dark; font-family: system-ui, -apple-system, sans-serif; }
      main { max-width: 560px; margin: 40px auto; padding: 0 16px; }
      fieldset { border: 1px solid color-mix(in srgb, currentColor 20%, transparent); border-radius: 8px; margin: 0 0 16px; padding: 12px 16px; }
      legend { font-weight: 600; padding: 0 4px; }
      label { display: flex; align-items: flex-start; gap: 8px; margin: 6px 0; }
      small { display: block; opacity: 0.7; }
      #status { color: #16a34a; min-height: 1.2em; }
    </style>
  </head>
  <body>
    <main>
      <h1>Settings</h1>

      <fieldset>
        <legend>When opening a code</legend>
        <label>
          <input type="radio" name="openMode" value="video" />
          <span>Video page directly <small>javtrailers.com/video/nsfs00484 — shows “not found” if the code isn’t on the site</small></span>
        </label>
        <label>
          <input type="radio" name="openMode" value="search" />
          <span>Search page <small>javtrailers.com/search/nsfs-484 — lists close matches too</small></span>
        </label>
        <label>
          <input type="checkbox" id="openInBackground" />
          <span>Open in a background tab</span>
        </label>
      </fieldset>

      <fieldset>
        <legend>On web pages</legend>
        <label>
          <input type="checkbox" id="inlineButtons" />
          <span>Show a ▶ button next to codes <small>Right-click → “Open trailer” on selected text works either way</small></span>
        </label>
      </fieldset>

      <p id="status"></p>
    </main>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
